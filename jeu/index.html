<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OP Life">
<meta name="theme-color" content="#0f2a44">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icone-180.png">
<title>One Piece Life</title>
<style>
  :root {
    --fond: #f4efe4; --carte: #fffaf0; --texte: #1e2428; --discret: #6a6f73; --ligne: #e2d9c6;
    --accent: #0f4c81; --accent-txt: #ffffff; --or: #b8860b; --ok: #2e7d4f; --ko: #b3361e; --ia: #6b3fa0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fond: #0e1720; --carte: #16222e; --texte: #eef1f3; --discret: #9aa7b2;
      --ligne: #26384a; --accent: #4f9be0; --accent-txt: #08131d; --or: #e3b341; --ok: #63c58c; --ko: #ff8a73; --ia: #b28cf0; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond); color: var(--texte); }
  body { font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
  #app { max-width: 640px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 16px calc(72px + env(safe-area-inset-bottom)); }
  h1 { font-size: 1.8rem; margin: 24px 0 4px; color: var(--accent); }
  h2 { font-size: 1.05rem; margin: 0 0 8px; }
  p { margin: 6px 0; }
  .titre p { color: var(--discret); margin-top: 0; }
  .discret { color: var(--discret); font-size: .9rem; }
  .carte { background: var(--carte); border: 1px solid var(--ligne); border-radius: 16px; padding: 14px; margin: 12px 0; }
  .carte.compacte { padding: 10px 12px; }
  label { display: block; font-weight: 600; font-size: .92rem; margin: 10px 0 4px; }
  label.case { display: flex; gap: 8px; align-items: center; font-weight: 500; }
  input, select { width: 100%; font: inherit; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--ligne);
    background: var(--fond); color: var(--texte); }
  input[type=checkbox] { width: auto; }
  button { font: inherit; font-size: .95rem; font-weight: 600; border-radius: 12px; padding: 10px 12px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-txt); }
  button.secondaire { background: transparent; color: var(--accent); }
  button.principal { width: 100%; margin-top: 12px; padding: 13px; }
  button.icone { background: transparent; color: var(--discret); border-color: var(--ligne); padding: 8px 12px; }
  .ligne-vie { display: flex; gap: 8px; margin: 6px 0; } .ligne-vie button:first-child { flex: 1; text-align: left; }
  .statut { position: sticky; top: 0; z-index: 2; background: var(--fond); padding: 10px 0 8px; border-bottom: 1px solid var(--ligne); }
  .tete { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-txt);
    display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; flex: none; }
  .identite { flex: 1; min-width: 0; line-height: 1.25; }
  .bourse { font-size: 1.05rem; color: var(--or); white-space: nowrap; }
  .petit { font-size: .82rem; }
  .jauges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; font-size: .8rem; align-items: center; }
  .jauges span { background: var(--carte); border: 1px solid var(--ligne); border-radius: 999px; padding: 2px 9px; }
  .jauges .ok { color: var(--ok); border-color: var(--ok); }
  .jauges .ko { color: var(--ko); border-color: var(--ko); }
  .jauges .region { color: var(--accent); border-color: var(--accent); }
  .jauges .ia { color: var(--ia); border-color: var(--ia); }
  .jauges .prime { color: var(--ko); border-color: var(--ko); font-weight: 700; }
  .jauges .energie { position: relative; width: 110px; overflow: hidden; padding: 2px 9px; }
  .energie i { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--ok) 25%, transparent); }
  .energie em { position: relative; font-style: normal; }
  .scene { margin: 12px 0 4px; padding: 14px; border-radius: 18px; color: #fff;
    background: linear-gradient(135deg, #0f4c81, #1b7a9e 60%, #2aa198); box-shadow: 0 6px 18px rgba(15, 76, 129, .25); }
  .scene-ile { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
  .scene-lieu { font-size: 1.25rem; font-weight: 800; margin: 2px 0 10px; }
  .presents { display: flex; gap: 6px; flex-wrap: wrap; }
  .presents .discret { color: rgba(255,255,255,.8); }
  .pnj { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35);
    color: #fff; border-radius: 999px; padding: 5px 12px 5px 5px; font-size: .88rem; }
  .pnj span { width: 24px; height: 24px; border-radius: 50%; background: #fff; color: #0f4c81; display: grid; place-items: center; font-size: .8rem; font-weight: 800; }
  .recit { max-height: 34dvh; overflow-y: auto; padding: 4px 2px; margin: 8px 0; }
  .recit p { margin: 5px 0; opacity: .78; }
  .recit p.dernier { opacity: 1; font-size: 1.04rem; }
  .sep-jour { text-align: center; font-size: .72rem; color: var(--discret); margin: 10px 0 4px; letter-spacing: .04em; }
  .recit p, .carte p[class^="e-"] { border-left: 3px solid transparent; padding-left: 8px; }
  .e-action, .e-naissance { border-color: var(--accent) !important; }
  .e-refus { color: var(--ko); border-color: var(--ko) !important; }
  .e-monde, .e-ellipse, .e-age { color: var(--discret); font-style: italic; }
  .e-mission { border-color: var(--or) !important; font-weight: 600; }
  .e-voyage { border-color: var(--accent) !important; font-weight: 600; }
  .e-famille { border-color: var(--ok) !important; font-weight: 600; }
  .e-sante { border-color: var(--ko) !important; }
  .e-narration { border-color: var(--ia) !important; }
  .e-evenement { border-color: var(--or) !important; font-weight: 700; background: color-mix(in srgb, var(--or) 10%, transparent); border-radius: 0 8px 8px 0; padding: 6px 8px; }
  .e-succes { color: var(--or); font-weight: 700; border-color: var(--or) !important; }
  .e-rumeur { color: var(--discret); font-size: .92rem; border-color: var(--or) !important; }
  .e-parole { color: var(--discret); text-align: right; border: 0 !important; }
  .e-attente { color: var(--ia); }
  .groupe { margin: 12px 0; }
  .groupe h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--discret); margin: 0 0 6px; }
  .grille { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .action { background: var(--carte); color: var(--texte); border: 1px solid var(--ligne); text-align: left; min-height: 48px;
    padding: 10px 12px; font-size: .9rem; line-height: 1.25; box-shadow: 0 1px 0 var(--ligne); }
  .action:active { transform: scale(.98); background: var(--ligne); }
  .action.danger { border-color: var(--ko); color: var(--ko); }
  .g-propositions .action { border-color: var(--or); background: color-mix(in srgb, var(--or) 12%, var(--carte)); }
  .g-prison .action { border-color: var(--ko); }
  .lieux { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .lieux::-webkit-scrollbar { display: none; }
  .chip { flex: none; background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 7px 14px; font-size: .88rem; }
  .temps { display: flex; gap: 6px; margin: 14px 0 8px; }
  .temps button { flex: 1; background: var(--texte); color: var(--fond); border-color: var(--texte); padding: 11px 4px; font-size: .88rem; }
  .saisie { display: flex; gap: 8px; margin: 4px 0 8px; }
  .saisie input { border-radius: 999px; }
  .saisie button { width: 48px; margin: 0; padding: 0; border-radius: 50%; flex: none; font-size: 1.1rem; }
  .ligne-champ { display: flex; gap: 8px; }
  .de { flex: none; width: 48px; font-size: 1.3rem; padding: 0; background: var(--carte); color: var(--texte); border-color: var(--ligne); }
  .scene { position: relative; overflow: hidden; min-height: 150px; }
  .scene .illustration { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,0) 60%); z-index: 0; }
  .scene > div { position: relative; z-index: 1; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .recit p.dernier { animation: apparition .35s ease-out; }
  @keyframes apparition { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .tuto { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: grid; place-items: end center; padding: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .tuto-carte { background: var(--carte); color: var(--texte); border-radius: 20px; padding: 20px; max-width: 520px; width: 100%; animation: apparition .3s ease-out; }
  .tuto-pas { color: var(--discret); font-size: .8rem; }
  .tuto-boutons { display: flex; gap: 8px; margin-top: 12px; }
  .tuto-boutons button { flex: 1; margin: 0; }
  .voile-temps { position: fixed; inset: 0; z-index: 15; display: grid; place-content: center; text-align: center; gap: 8px; color: #fff;
    background: rgba(11, 26, 51, .55); font-weight: 700; transition: opacity .3s; }
  .voile-temps.fin { opacity: 0; }
  .sablier { font-size: 2.4rem; animation: tourne .8s linear; }
  @keyframes tourne { to { transform: rotate(180deg); } }
  [data-contraste] { --discret: var(--texte); --ligne: var(--texte); }
  [data-contraste] .action, [data-contraste] .chip { border-width: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  /* Pas de zoom au double appui ni de sélection de texte sur les boutons (iPhone). */
  html, body, button, a, input, select, label { touch-action: manipulation; }
  button { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .onglets { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; background: var(--carte);
    border-top: 1px solid var(--ligne); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); justify-content: center; }
  .onglets button { flex: 1; max-width: 160px; background: transparent; border: 0; color: var(--discret); }
  .onglets button.actif { color: var(--accent); }
  .stat { display: grid; grid-template-columns: 1fr 90px 36px; align-items: center; gap: 8px; margin: 6px 0; }
  .stat b { text-align: right; }
  .barre { height: 8px; background: var(--ligne); border-radius: 999px; overflow: hidden; }
  .barre i { display: block; height: 100%; background: var(--accent); }
  .mission { border-top: 1px solid var(--ligne); padding: 8px 0; }
  .m-active { color: var(--or); } .m-réussie { color: var(--ok); } .m-échouée { color: var(--ko); }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 9;
    background: var(--texte); color: var(--fond); padding: 12px 14px; border-radius: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<noscript>Active JavaScript pour jouer.</noscript>
<script type="module" src="./app.js"></script>
</body>
</html>

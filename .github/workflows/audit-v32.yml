name: V8.6 Live Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'scripts/qa-v64.mjs'
      - 'scripts/qa-v65.mjs'
      - 'scripts/qa-v66.mjs'
      - 'scripts/qa-v67.mjs'
      - 'scripts/qa-v671.mjs'
      - 'scripts/qa-v68.mjs'
      - 'scripts/qa-v69.mjs'
      - 'scripts/qa-v70.mjs'
      - 'scripts/qa-v71.mjs'
      - 'scripts/qa-v72.mjs'
      - 'scripts/qa-v73.mjs'
      - 'scripts/qa-v74.mjs'
      - 'scripts/qa-v75.mjs'
      - 'scripts/qa-v76.mjs'
      - 'scripts/qa-v77.mjs'
      - 'scripts/qa-v78.mjs'
      - 'scripts/qa-v79.mjs'
      - 'scripts/qa-v80.mjs'
      - 'scripts/qa-v81.mjs'
      - 'scripts/qa-v82.mjs'
      - 'scripts/qa-v83.mjs'
      - 'scripts/qa-v84.mjs'
      - 'scripts/qa-v85.mjs'
      - 'scripts/qa-v86.mjs'
      - 'app.js'
      - 'content-v1.js'
      - 'scripts/audit-v32.mjs'
      - '.github/workflows/audit-v32.yml'
permissions:
  contents: read
concurrency:
  group: v86-live-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V6.4 regression QA
        run: node scripts/qa-v64.mjs
      - name: Run V6.5 regression QA
        run: node scripts/qa-v65.mjs
      - name: Run V6.6 regression QA
        run: node scripts/qa-v66.mjs
      - name: Run V6.7 regression QA
        run: node scripts/qa-v67.mjs
      - name: Run V6.7.1 regression QA
        run: node scripts/qa-v671.mjs
      - name: Run V6.8 regression QA
        run: node scripts/qa-v68.mjs
      - name: Run V6.9 regression QA
        run: node scripts/qa-v69.mjs
      - name: Run V7.0 regression QA
        run: node scripts/qa-v70.mjs
      - name: Run live V7.1 runtime QA
        run: node scripts/qa-v71.mjs
      - name: Run V7.2 Combat and Powers QA
        run: node scripts/qa-v72.mjs
      - name: Run V7.3 Career and Organization QA
        run: node scripts/qa-v73.mjs
      - name: Run V7.4 Relations and Persona QA
        run: node scripts/qa-v74.mjs
      - name: Run V7.5 World and Canon QA
        run: node scripts/qa-v75.mjs
      - name: Run V7.6 UI and Game Feel QA
        run: node scripts/qa-v76.mjs
      - name: Run V7.7 Consequences and Life Events QA
        run: node scripts/qa-v77.mjs
      - name: Run V7.8 Personal Life and Household QA
        run: node scripts/qa-v78.mjs
      - name: Run V7.9 Education and Youth QA
        run: node scripts/qa-v79.mjs
      - name: Run V8.0 Simulation Core and Life Director QA
        run: node scripts/qa-v80.mjs
      - name: Run V8.1 Faction Identity QA
        run: node scripts/qa-v81.mjs
      - name: Run V8.2 Regional Sagas & Campaigns QA
        run: node scripts/qa-v82.mjs
      - name: Run V8.3 Nemesis & Rivalry QA
        run: node scripts/qa-v83.mjs
      - name: Run V8.4 Crew & Organization QA
        run: node scripts/qa-v84.mjs
      - name: Run V8.5 Voyage & Exploration QA
        run: node scripts/qa-v85.mjs
      - name: Run V8.6 Daily Life & Opportunities QA
        run: node scripts/qa-v86.mjs
      - name: Run legacy engine trend audit
        continue-on-error: true
        run: node scripts/audit-v32.mjs

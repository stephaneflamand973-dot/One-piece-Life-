name: V5.0 Long Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'content-v1.js'
      - 'scripts/qa-v32.mjs'
      - 'scripts/validate.mjs'
      - 'scripts/validate-content.mjs'
      - 'scripts/audit-v32.mjs'
      - '.github/workflows/audit-v32.yml'
      - '.github/workflows/qa.yml'
      - '.github/workflows/validate.yml'
      - '.github/workflows/pages.yml'

concurrency:
  group: v5-long-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run V5.0 Grand Journey audit
        run: node scripts/audit-v32.mjs

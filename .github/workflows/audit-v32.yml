name: V6.4 Long Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'content-v1.js'
      - 'scripts/qa-v32.mjs'
      - 'scripts/audit-v32.mjs'
      - '.github/workflows/audit-v32.yml'

permissions:
  contents: read

concurrency:
  group: v64-long-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V6.4 release markers
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const checks={
            annual:s.includes('AVANCER D’UN AN'),
            risk:s.includes('function v64RiskProfile'),
            adventure:s.includes('function v64QueueAdventureDecision'),
            localDiscovery:s.includes('function v64AdventureMonthTick'),
            rarity:s.includes('function v64RarityMultiplier'),
            fruitCooldown:s.includes('fruitCooldownUntil'),
            hookExpiry:!s.includes("h.expiresAt<v58MonthIndex()+12")
          };
          console.log(checks);
          if(Object.values(checks).some(v=>!v)) process.exit(1);
          NODE
      - name: Run multi-decade gameplay stress audit
        run: node scripts/audit-v32.mjs

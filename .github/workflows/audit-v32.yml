name: V6.3 Long Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit V6.3 release markers
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const checks={
            annual:s.includes('AVANCER D’UN AN'),
            fatigue:s.includes('function v63FatigueProfile'),
            prestige:s.includes('function v63PrestigeCheck'),
            mastery:s.includes('function v63MasteryEfficiency'),
            economy:s.includes('function v63EconomyAction'),
            missionSafety:s.includes('missionRetreatHealth')
          };
          console.log(checks);
          if(Object.values(checks).some(v=>!v)) process.exit(1);
          NODE

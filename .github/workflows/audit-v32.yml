name: V6.7.1 Live Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/qa-v64.mjs'
      - 'scripts/qa-v65.mjs'
      - 'scripts/qa-v66.mjs'
      - 'scripts/qa-v67.mjs'
      - 'scripts/qa-v671.mjs'
      - 'app.js'
      - 'content-v1.js'
      - 'scripts/qa-v32.mjs'
      - 'scripts/audit-v32.mjs'
      - '.github/workflows/audit-v32.yml'

permissions:
  contents: read

concurrency:
  group: v671-live-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V6.4 regression QA
        run: node scripts/qa-v64.mjs
      - name: Run V6.5 regression QA
        run: node scripts/qa-v65.mjs
      - name: Run V6.6 regression QA
        run: node scripts/qa-v66.mjs
      - name: Run V6.7 regression QA
        run: node scripts/qa-v67.mjs
      - name: Run live V6.7.1 runtime QA
        run: node scripts/qa-v671.mjs
      - name: Run legacy engine trend audit
        continue-on-error: true
        run: node scripts/audit-v32.mjs

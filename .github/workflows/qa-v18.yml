name: V1.8 Adaptive Life Loop QA

on:
  push:
    branches: [v1.8-adaptive-life-loop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate static game
        run: node scripts/validate.mjs
      - name: Validate V1 content pack
        run: node scripts/validate-content.mjs
      - name: Professional V1.8 systems QA
        run: node scripts/qa-v18.mjs

# V1.8 QA trigger

name: V5.0 QA

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'content-v1.js'
      - 'scripts/qa-v32.mjs'
      - 'scripts/validate.mjs'
      - 'scripts/validate-content.mjs'
      - 'scripts/audit-v32.mjs'
      - '.github/workflows/qa.yml'
      - '.github/workflows/audit-v32.yml'
      - '.github/workflows/validate.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'content-v1.js'
      - 'scripts/qa-v32.mjs'
      - 'scripts/validate.mjs'
      - 'scripts/validate-content.mjs'
      - 'scripts/audit-v32.mjs'
      - '.github/workflows/qa.yml'
      - '.github/workflows/audit-v32.yml'
      - '.github/workflows/validate.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: v5-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full simulation QA
        run: node scripts/qa-v32.mjs

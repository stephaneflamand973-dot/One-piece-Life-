name: V8.1 QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'src/**'
      - 'scripts/qa-v64.mjs'
      - 'scripts/qa-v65.mjs'
      - 'scripts/qa-v66.mjs'
      - 'scripts/qa-v67.mjs'
      - 'scripts/qa-v671.mjs'
      - 'scripts/qa-v68.mjs'
      - 'scripts/qa-v69.mjs'
      - 'scripts/qa-v70.mjs'
      - 'scripts/qa-v71.mjs'
      - 'scripts/qa-v72.mjs'
      - 'scripts/qa-v73.mjs'
      - 'scripts/qa-v74.mjs'
      - 'scripts/qa-v75.mjs'
      - 'scripts/qa-v76.mjs'
      - 'scripts/qa-v77.mjs'
      - 'scripts/qa-v78.mjs'
      - 'scripts/qa-v79.mjs'
      - 'scripts/qa-v80.mjs'\n      - 'scripts/qa-v81.mjs'
      - 'QA-V7.1.md'
      - 'QA-V7.2.md'
      - 'QA-V7.3.md'
      - 'QA-V7.4.md'
      - 'QA-V7.5.md'
      - 'QA-V7.6.md'
      - 'QA-V7.7.md'
      - 'QA-V7.8.md'
      - 'QA-V7.9.md'
      - 'QA-V8.0.md'\n      - 'QA-V8.1.md'
      - '.github/workflows/qa.yml'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: v81-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify V6.4 regression systems
        run: node scripts/qa-v64.mjs
      - name: Verify V6.5 regression systems
        run: node scripts/qa-v65.mjs
      - name: Verify V6.6 regression systems
        run: node scripts/qa-v66.mjs
      - name: Verify V6.7 regression systems
        run: node scripts/qa-v67.mjs
      - name: Verify V6.7.1 stabilization
        run: node scripts/qa-v671.mjs
      - name: Verify V6.8 causal world
        run: node scripts/qa-v68.mjs
      - name: Verify V6.9 endgame
        run: node scripts/qa-v69.mjs
      - name: Verify V7.0 canon expansion
        run: node scripts/qa-v70.mjs
      - name: Verify live V7.1 modular Arc Director
        run: node scripts/qa-v71.mjs
      - name: Verify V7.2 Combat and Powers 3.0
        run: node scripts/qa-v72.mjs
      - name: Verify V7.3 Career and Organization 3.0
        run: node scripts/qa-v73.mjs
      - name: Verify V7.4 Relations and Persona 3.0
        run: node scripts/qa-v74.mjs
      - name: Verify V7.5 World and Canon 3.0
        run: node scripts/qa-v75.mjs
      - name: Verify V7.6 UI and Game Feel 3.0
        run: node scripts/qa-v76.mjs
      - name: Verify V7.7 Consequences and Life Events 3.0
        run: node scripts/qa-v77.mjs
      - name: Verify V7.8 Personal Life and Household 3.0
        run: node scripts/qa-v78.mjs
      - name: Verify V7.9 Education and Youth 3.0
        run: node scripts/qa-v79.mjs
      - name: Verify V8.0 Simulation Core and Life Director 4.0
        run: node scripts/qa-v80.mjs

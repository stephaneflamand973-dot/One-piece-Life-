name: V6.7 QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/qa-v64.mjs'
      - 'scripts/qa-v65.mjs'
      - 'scripts/qa-v66.mjs'
      - 'scripts/qa-v67.mjs'
      - 'QA-V6.7.md'
      - '.github/workflows/qa.yml'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: v67-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify V6.4 regression systems
        run: node scripts/qa-v64.mjs
      - name: Verify V6.5 regression systems
        run: node scripts/qa-v65.mjs
      - name: Verify V6.6 regression systems
        run: node scripts/qa-v66.mjs
      - name: Verify live V6.7 relationship and crew systems
        run: node scripts/qa-v67.mjs

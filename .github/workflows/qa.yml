name: V6.3 QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'QA-V6.3.md'
      - '.github/workflows/qa.yml'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/qa.yml'
  workflow_dispatch:

concurrency:
  group: v63-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V6.3 balance systems
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const required=[
            'function v63FatigueProfile',
            'function v63MasteryEfficiency',
            'function v63PrestigeCheck',
            'function v63RankThreshold',
            'function v63EconomyAction',
            'missionDamage',
            'missionRetreatHealth',
            'function v63GearDamageMult',
            'function v63IntelBonus'
          ];
          const missing=required.filter(x=>!s.includes(x));
          if(missing.length) throw new Error('Missing V6.3 systems: '+missing.join(', '));
          console.log('V6.3 balance systems present');
          NODE

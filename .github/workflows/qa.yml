      - 'QA-V9.5.md'
      - '.github/workflows/qa.yml'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: v95-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify V6.4 regression systems
        run: node scripts/qa-v64.mjs
      - name: Verify V6.5 regression systems
        run: node scripts/qa-v65.mjs
      - name: Verify V6.6 regression systems
        run: node scripts/qa-v66.mjs
      - name: Verify V6.7 regression systems
        run: node scripts/qa-v67.mjs
      - name: Verify V6.7.1 stabilization
        run: node scripts/qa-v671.mjs
      - name: Verify V6.8 causal world
        run: node scripts/qa-v68.mjs
      - name: Verify V6.9 endgame
        run: node scripts/qa-v69.mjs
      - name: Verify V7.0 canon expansion
        run: node scripts/qa-v70.mjs
      - name: Verify live V7.1 modular Arc Director
        run: node scripts/qa-v71.mjs
      - name: Verify V7.2 Combat and Powers 3.0
        run: node scripts/qa-v72.mjs
      - name: Verify V7.3 Career and Organization 3.0

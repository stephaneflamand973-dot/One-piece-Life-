name: Reboot V13 QA
on:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'manifest.webmanifest', 'src/reboot/**', 'scripts/qa-reboot-v13.mjs', 'classic.html', '.github/workflows/qa.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reboot-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check reboot module syntax
        run: |
          node --check src/reboot/data.js
          node --check src/reboot/engine.js
          node --check src/reboot/ui.js
      - name: Test fresh life and BitLife-style gameplay
        run: node scripts/qa-reboot-v13.mjs

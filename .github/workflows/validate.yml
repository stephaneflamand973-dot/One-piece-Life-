name: Validate V9.1
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'src/**'
      - 'scripts/qa-v64.mjs'
      - 'scripts/qa-v65.mjs'
      - 'scripts/qa-v66.mjs'
      - 'scripts/qa-v67.mjs'
      - 'scripts/qa-v671.mjs'
      - 'scripts/qa-v68.mjs'
      - 'scripts/qa-v69.mjs'
      - 'scripts/qa-v70.mjs'
      - 'scripts/qa-v71.mjs'
      - 'scripts/qa-v72.mjs'
      - 'scripts/qa-v73.mjs'
      - 'scripts/qa-v74.mjs'
      - 'scripts/qa-v75.mjs'
      - 'scripts/qa-v76.mjs'
      - 'scripts/qa-v77.mjs'
      - 'scripts/qa-v78.mjs'
      - 'scripts/qa-v79.mjs'
      - 'scripts/qa-v80.mjs'
      - 'scripts/qa-v81.mjs'
      - 'scripts/qa-v82.mjs'
      - 'scripts/qa-v83.mjs'
      - 'scripts/qa-v84.mjs'
      - 'scripts/qa-v85.mjs'
      - 'scripts/qa-v86.mjs'
      - 'scripts/qa-v87.mjs'
      - 'scripts/qa-v88.mjs'
      - 'scripts/qa-v89.mjs'
      - 'scripts/qa-v90.mjs'
      - 'scripts/qa-v91.mjs'
      - 'scripts/qa-v91-runtime.mjs'
      - 'QA-V7.1.md'
      - 'QA-V7.2.md'
      - 'QA-V7.3.md'
      - 'QA-V7.4.md'
      - 'QA-V7.5.md'
      - 'QA-V7.6.md'
      - 'QA-V7.7.md'
      - 'QA-V7.8.md'
      - 'QA-V7.9.md'
      - 'QA-V8.0.md'
      - 'QA-V8.1.md'
      - 'QA-V8.2.md'
      - 'QA-V8.3.md'
      - 'QA-V8.4.md'
      - 'QA-V8.5.md'
      - 'QA-V8.6.md'
      - 'QA-V8.7.md'
      - 'QA-V8.8.md'
      - 'QA-V8.9.md'
      - 'QA-V9.0.md'
      - 'QA-V9.1.md'
      - '.github/workflows/validate.yml'
      - '.github/workflows/qa.yml'
      - '.github/workflows/audit-v32.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: v91-validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone and modular V9.1
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const m=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!m)throw new Error('inline game script missing');
          new Function(m[1]);
          const saveVersion=Number(html.match(/const SAVE_VERSION\s*=\s*(\d+);/)?.[1]||0);
          const gameVersion=html.match(/const GAME_VERSION\s*=\s*'([0-9.]+)';/)?.[1]||'0.0.0';
          if(!html.includes('ONE PIECE LIFE — V9.1'))throw new Error('V9.1 title missing');
          if(saveVersion<910)throw new Error('Save migration 910+ missing');
          if(gameVersion!=='9.1.0')throw new Error('Game version 9.1.0 missing');
          const assets=[
            'src/core/module-registry.js','src/data/arc-definitions-v71.js','src/v71/arc-director.js','src/v71/arc-director.css',
            'src/data/combat-techniques-v72.js','src/v72/combat-engine-v72.js','src/data/career-organizations-v73.js','src/v73/career-organization-engine-v73.js',
            'src/data/relation-personas-v74.js','src/v74/relation-persona-engine-v74.js','src/data/world-canon-v75.js','src/v75/world-canon-engine-v75.js',
            'src/data/ui-layout-v76.js','src/v76/ui-components-v76.js','src/v76/ui-v76.css',
            'src/data/consequences-v77.js','src/v77/consequence-engine-v77.js','src/v77/consequences-v77.css',
            'src/data/personal-life-v78.js','src/v78/personal-life-engine-v78.js','src/v78/personal-life-v78.css',
            'src/data/education-v79.js','src/v79/education-engine-v79.js','src/v79/education-v79.css',
            'src/data/simulation-core-v80.js','src/v80/simulation-core-v80.js','src/v80/simulation-core-v80.css',
            'src/data/faction-identity-v81.js','src/v81/faction-identity-engine-v81.js','src/v81/faction-identity-v81.css',
            'src/data/campaigns-v82.js','src/v82/campaign-engine-v82.js','src/v82/campaigns-v82.css',
            'src/data/antagonists-v83.js','src/v83/antagonist-engine-v83.js','src/v83/antagonists-v83.css',
            'src/data/crew-v84.js','src/v84/crew-engine-v84.js','src/v84/crew-v84.css',
            'src/data/voyage-v85.js','src/v85/voyage-engine-v85.js','src/v85/voyage-v85.css',
            'src/data/daily-life-v86.js','src/v86/daily-life-engine-v86.js','src/v86/daily-life-v86.css',
            'src/data/settlements-v87.js','src/v87/settlement-engine-v87.js','src/v87/settlements-v87.css',
            'src/data/markets-v88.js','src/v88/market-engine-v88.js','src/v88/markets-v88.css',
            'src/data/equipment-v89.js','src/v89/equipment-engine-v89.js','src/v89/equipment-v89.css',
            'src/data/game-flow-v90.js','src/v90/game-flow-engine-v90.js','src/v90/game-flow-v90.css',
            'src/data/goals-v91.js','src/v91/goals-engine-v91.js','src/v91/goals-v91.css'
          ];
          for(const x of assets){if(!fs.existsSync(x))throw new Error('missing modular asset '+x);if(!html.includes(x))throw new Error('index does not load '+x)}
          for(const x of assets.filter(x=>x.endsWith('.js')))new Function(fs.readFileSync(x,'utf8'));
          for(const x of ['function v71Ensure','function v72CombatModule','function v73Module','function v74Module','function v75Module','function v76Module','function v77Module','function v78Module','function v79Module','function v80Module','function v80PriorityInterrupt','function v80RenderActiveTab','function v81Module','function v81Ensure','function v81QueueFaction','function renderV81FactionIdentity','function v82Module','function v82Ensure','function v82AnnualWorldTick','function v82QueueCampaign','function renderV82Campaigns','function v83Module','function v83Ensure','function v83BindCampaign','function v83Candidate','function v83QueueNemesis','function renderV83Nemeses','function v84Module','function v84Ensure','function v84MissionSupport','function v84Candidate','function v84QueueCrew','function v84RenderCrew','function v85Module','function v85Ensure','function v85RoutePreview','function v85TickVoyage','function renderV85Exploration','function v86Module','function v86Ensure','function v86MonthlyTick','function v86ResolveOpportunity','function renderV86Daily','function v87Module','function v87Ensure','function v87OnArrival','function v87Service','function renderV87Settlement','function v88Module','function v88Ensure','function v88Context','function v88MarketAvailable','function v88Trade','function renderV88Market','function v89Module','function v89Ensure','function v89EquipmentEffects','function v89MaybeLoot','function renderV89Equipment','function v90Module','function v90Ensure','function v90Context','function v90ApplyPreset','function renderV90GameFlow','function v91Module','function v91Ensure','function v91Context','function v91Sync','function v91ApplyIntent','function renderV91Goals'])if(!html.includes(x))throw new Error('missing '+x);
          if(!html.includes('id="v80DirectorCard"'))throw new Error('V8.0 Life Director UI missing');
          if(html.includes('renderTimeline();renderCharacter();renderAbilities();renderRelations();renderWorld();renderDev();v76AfterRender()'))throw new Error('eager heavy-panel render regression');
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));if(!String(manifest.description||'').includes('V9.1'))throw new Error('manifest not V9.1');
          const sw=fs.readFileSync('sw.js','utf8');if(!sw.includes('v9-1-0'))throw new Error('service worker cache not V9.1.0');
          for(const x of assets)if(!sw.includes(x))throw new Error('service worker missing modular asset '+x);
          console.log('V9.1 static + modular validation OK');
          NODE
      - name: Validate V6.4 regression behavior
        run: node scripts/qa-v64.mjs
      - name: Validate V6.5 regression behavior
        run: node scripts/qa-v65.mjs
      - name: Validate V6.6 regression behavior
        run: node scripts/qa-v66.mjs
      - name: Validate V6.7 regression behavior
        run: node scripts/qa-v67.mjs
      - name: Validate V6.7.1 regression behavior
        run: node scripts/qa-v671.mjs
      - name: Validate V6.8 regression behavior
        run: node scripts/qa-v68.mjs
      - name: Validate V6.9 regression behavior
        run: node scripts/qa-v69.mjs
      - name: Validate V7.0 regression behavior
        run: node scripts/qa-v70.mjs
      - name: Validate live V7.1 behavior
        run: node scripts/qa-v71.mjs
      - name: Validate V7.2 Combat and Powers
        run: node scripts/qa-v72.mjs
      - name: Validate V7.3 Career and Organization
        run: node scripts/qa-v73.mjs
      - name: Validate V7.4 Relations and Persona
        run: node scripts/qa-v74.mjs
      - name: Validate V7.5 World and Canon
        run: node scripts/qa-v75.mjs
      - name: Validate V7.6 UI and Game Feel
        run: node scripts/qa-v76.mjs
      - name: Validate V7.7 Consequences and Life Events
        run: node scripts/qa-v77.mjs
      - name: Validate V7.8 Personal Life and Household
        run: node scripts/qa-v78.mjs
      - name: Validate V7.9 Education and Youth
        run: node scripts/qa-v79.mjs
      - name: Validate V8.0 Simulation Core and Life Director
        run: node scripts/qa-v80.mjs
      - name: Validate V8.1 Faction Identity
        run: node scripts/qa-v81.mjs
      - name: Validate V8.2 Regional Sagas & Campaigns
        run: node scripts/qa-v82.mjs
      - name: Validate V8.3 Nemesis & Rivalry
        run: node scripts/qa-v83.mjs
      - name: Validate V8.4 Crew & Organization
        run: node scripts/qa-v84.mjs
      - name: Validate V8.5 Voyage & Exploration
        run: node scripts/qa-v85.mjs
      - name: Validate V8.6 Daily Life & Opportunities
        run: node scripts/qa-v86.mjs
      - name: Validate V8.7 Islands & Settlements
        run: node scripts/qa-v87.mjs
      - name: Validate V8.8 Markets, Cargo & Trade
        run: node scripts/qa-v88.mjs
      - name: Validate V8.9 Equipment, Items & Loot
        run: node scripts/qa-v89.mjs
      - name: Validate V9.0 Game Flow & UX
        run: node scripts/qa-v90.mjs
      - name: Validate V9.1 Goals & Player Agency
        run: node scripts/qa-v91.mjs
      - name: Validate V9.1 integrated runtime
        run: node scripts/qa-v91-runtime.mjs

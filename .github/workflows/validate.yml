name: Reboot V13 Validate
on:
  push:
    branches: [main]
    paths: ['index.html', 'src/reboot/**', 'scripts/qa-reboot-v13.mjs', 'sw.js', '.github/workflows/validate.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reboot-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new architecture and regression tests
        run: |
          node --check scripts/qa-reboot-v13.mjs
          node scripts/qa-reboot-v13.mjs

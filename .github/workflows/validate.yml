name: Validate V7.0
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'scripts/qa-v64.mjs'
      - 'scripts/qa-v65.mjs'
      - 'scripts/qa-v66.mjs'
      - 'scripts/qa-v67.mjs'
      - 'scripts/qa-v671.mjs'
      - 'scripts/qa-v68.mjs'
      - 'scripts/qa-v69.mjs'
      - 'scripts/qa-v70.mjs'
      - 'QA-V7.0.md'
      - '.github/workflows/validate.yml'
      - '.github/workflows/qa.yml'
      - '.github/workflows/audit-v32.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
concurrency:
  group: v70-validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone V7.0
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const m=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('inline game script missing');
          new Function(m[1]);
          if(!html.includes('ONE PIECE LIFE — V7.0')) throw new Error('V7.0 title missing');
          if(!html.includes('const SAVE_VERSION = 700;')) throw new Error('Save migration 700 missing');
          if(!html.includes("const GAME_VERSION = '7.0.0';")) throw new Error('Game version 7.0.0 missing');
          for(const x of ['const CANON_CREWS','const V70_PERSONAS','const V70_CANON_REQUIREMENTS','const V70_CANON_EFFECTS','function v70Ensure','function v70PersonaRelation','function v70CanonMissionCandidates','function v70ApplyCanonEffects']) if(!html.includes(x)) throw new Error('missing '+x);
          for(const x of ['marineford_war','egghead_incident','blackbeard_crew','Gomu Gomu no Mi','Hachinosu','Elbaf']) if(!html.includes(x)) throw new Error('content missing '+x);
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if(!String(manifest.description||'').includes('V7.0')) throw new Error('manifest not V7.0');
          const sw=fs.readFileSync('sw.js','utf8');
          if(!sw.includes('v7-0-0')) throw new Error('service worker cache not V7.0.0');
          console.log('V7.0 static validation OK');
          NODE
      - name: Validate V6.4 regression behavior
        run: node scripts/qa-v64.mjs
      - name: Validate V6.5 regression behavior
        run: node scripts/qa-v65.mjs
      - name: Validate V6.6 regression behavior
        run: node scripts/qa-v66.mjs
      - name: Validate V6.7 regression behavior
        run: node scripts/qa-v67.mjs
      - name: Validate V6.7.1 regression behavior
        run: node scripts/qa-v671.mjs
      - name: Validate V6.8 regression behavior
        run: node scripts/qa-v68.mjs
      - name: Validate V6.9 regression behavior
        run: node scripts/qa-v69.mjs
      - name: Validate live V7.0 behavior
        run: node scripts/qa-v70.mjs

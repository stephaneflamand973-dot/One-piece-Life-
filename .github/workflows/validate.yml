name: Validate game

on:
  push:
    branches:
      - main
      - 'v*'
    paths:
      - 'app.js'
      - 'index.html'
      - 'content-v1.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/validate.mjs'
      - 'scripts/validate-content.mjs'
      - 'scripts/qa-v32.mjs'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate static game
        run: node scripts/validate.mjs
      - name: Validate V1 content pack
        run: node scripts/validate-content.mjs
      - name: Professional systems QA
        run: |
          QA_SCRIPT=$(ls scripts/qa-v*.mjs | sort -V | tail -1)
          echo "Running $QA_SCRIPT"
          node "$QA_SCRIPT"

name: Validate V6.7
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'scripts/qa-v64.mjs'
      - 'scripts/qa-v65.mjs'
      - 'scripts/qa-v66.mjs'
      - 'scripts/qa-v67.mjs'
      - 'QA-V6.7.md'
      - '.github/workflows/validate.yml'
      - '.github/workflows/qa.yml'
      - '.github/workflows/audit-v32.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
concurrency:
  group: v67-validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone V6.7
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const m=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('inline game script missing');
          new Function(m[1]);
          if(!html.includes('ONE PIECE LIFE — V6.7')) throw new Error('V6.7 title missing');
          if(!html.includes('const SAVE_VERSION = 670;')) throw new Error('Save migration 670 missing');
          if(!html.includes("const GAME_VERSION = '6.7.0';")) throw new Error('Game version 6.7.0 missing');
          for(const x of ['function v67Ensure','function v67CrewTick','function v67CrewMetrics','function v67SetMentor','function v67ResolveCrewConflict']) if(!html.includes(x)) throw new Error('missing '+x);
          for(const x of ["v67MentorMultiplier('skills',k)","v67RivalMultiplier('skills',k)","v67CrewTick(months)","m.status='left'","id:'v67_mentor_offer_'"]) if(!html.includes(x)) throw new Error('missing '+x);
          if(!html.includes('Cohésion ')) throw new Error('crew cohesion UI missing');
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if(!String(manifest.description||'').includes('V6.7')) throw new Error('manifest not V6.7');
          const sw=fs.readFileSync('sw.js','utf8');
          if(!sw.includes('v6-7-0')) throw new Error('service worker cache not V6.7.0');
          console.log('V6.7 static validation OK');
          NODE
      - name: Validate V6.4 regression behavior
        run: node scripts/qa-v64.mjs
      - name: Validate V6.5 regression behavior
        run: node scripts/qa-v65.mjs
      - name: Validate V6.6 regression behavior
        run: node scripts/qa-v66.mjs
      - name: Validate live V6.7 behavior
        run: node scripts/qa-v67.mjs

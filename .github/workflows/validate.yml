name: Validate V6.9
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'scripts/qa-v64.mjs'
      - 'scripts/qa-v65.mjs'
      - 'scripts/qa-v66.mjs'
      - 'scripts/qa-v67.mjs'
      - 'scripts/qa-v671.mjs'
      - 'scripts/qa-v68.mjs'
      - 'scripts/qa-v69.mjs'
      - 'QA-V6.9.md'
      - '.github/workflows/validate.yml'
      - '.github/workflows/qa.yml'
      - '.github/workflows/audit-v32.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
concurrency:
  group: v69-validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone V6.9
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const m=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('inline game script missing');
          new Function(m[1]);
          if(!html.includes('ONE PIECE LIFE — V6.9')) throw new Error('V6.9 title missing');
          if(!html.includes('const SAVE_VERSION = 690;')) throw new Error('Save migration 690 missing');
          if(!html.includes("const GAME_VERSION = '6.9.0';")) throw new Error('Game version 6.9.0 missing');
          for(const x of ['function v69Ensure','function v69CareerTier','function v69AnnualEconomy','function v69StrategicAction','function v69DelegateMission','function v69LegacyScore','function renderV69Endgame']) if(!html.includes(x)) throw new Error('missing '+x);
          for(const x of ["v69AnnualEconomy();v69Milestones()","v68ApplyMissionOutcome","data-v69-delegate","data-v69-directive","data-v69-asset"]) if(!html.includes(x)) throw new Error('missing '+x);
          if(!html.includes('id="v69EndgameCard"')||!html.includes('id="v69AssetsCard"')) throw new Error('V6.9 endgame UI missing');
          if(!html.includes("$$('[data-v63-economy]').forEach")) throw new Error('economy multi-button binding regression');
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if(!String(manifest.description||'').includes('V6.9')) throw new Error('manifest not V6.9');
          const sw=fs.readFileSync('sw.js','utf8');
          if(!sw.includes('v6-9-0')) throw new Error('service worker cache not V6.9.0');
          console.log('V6.9 static validation OK');
          NODE
      - name: Validate V6.4 regression behavior
        run: node scripts/qa-v64.mjs
      - name: Validate V6.5 regression behavior
        run: node scripts/qa-v65.mjs
      - name: Validate V6.6 regression behavior
        run: node scripts/qa-v66.mjs
      - name: Validate V6.7 regression behavior
        run: node scripts/qa-v67.mjs
      - name: Validate V6.7.1 regression behavior
        run: node scripts/qa-v671.mjs
      - name: Validate V6.8 regression behavior
        run: node scripts/qa-v68.mjs
      - name: Validate live V6.9 behavior
        run: node scripts/qa-v69.mjs

name: Validate game

on:
  push:
    branches: [main, hotfix-v1.7-advance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate static game
        run: node scripts/validate.mjs
      - name: Validate V1 content pack
        run: node scripts/validate-content.mjs
      - name: Professional systems QA
        run: node scripts/qa-v17.mjs

name: Validate game

on:
  push:
    branches:
      - main
      - 'v*'
    paths:
      - 'app.js'
      - 'index.html'
      - 'content-v1.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/validate.mjs'
      - 'scripts/validate-content.mjs'
      - 'scripts/qa-v32.mjs'
      - 'scripts/audit-v32.mjs'
      - '.github/workflows/validate.yml'
      - '.github/workflows/qa.yml'
      - '.github/workflows/audit-v32.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: v5-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate static game
        run: node scripts/validate.mjs
      - name: Validate V1 content pack
        run: node scripts/validate-content.mjs

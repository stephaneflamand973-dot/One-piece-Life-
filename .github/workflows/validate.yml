name: Validate V6.8
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'scripts/qa-v64.mjs'
      - 'scripts/qa-v65.mjs'
      - 'scripts/qa-v66.mjs'
      - 'scripts/qa-v67.mjs'
      - 'scripts/qa-v671.mjs'
      - 'scripts/qa-v68.mjs'
      - 'QA-V6.8.md'
      - '.github/workflows/validate.yml'
      - '.github/workflows/qa.yml'
      - '.github/workflows/audit-v32.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
concurrency:
  group: v68-validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone V6.8
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const m=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('inline game script missing');
          new Function(m[1]);
          if(!html.includes('ONE PIECE LIFE — V6.8')) throw new Error('V6.8 title missing');
          if(!html.includes('const SAVE_VERSION = 680;')) throw new Error('Save migration 680 missing');
          if(!html.includes("const GAME_VERSION = '6.8.0';")) throw new Error('Game version 6.8.0 missing');
          for(const x of ['function v68Ensure','function v68RegionState','function v68CausalMissionCandidates','function v68ApplyMissionOutcome','function v68ApplyHookOutcome','function v68WorldTick']) if(!html.includes(x)) throw new Error('missing '+x);
          for(const x of ["v68ApplyMissionOutcome(m,'success')","v68ApplyHookOutcome(h,success)","v68TravelRisk(p.travel.from,p.travel.destination)","Prix locaux ×"]) if(!html.includes(x)) throw new Error('missing '+x);
          if(!html.includes('id="causalRegionState"')||!html.includes('id="causalLedger"')) throw new Error('causal world UI missing');
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if(!String(manifest.description||'').includes('V6.8')) throw new Error('manifest not V6.8');
          const sw=fs.readFileSync('sw.js','utf8');
          if(!sw.includes('v6-8-0')) throw new Error('service worker cache not V6.8.0');
          console.log('V6.8 static validation OK');
          NODE
      - name: Validate V6.4 regression behavior
        run: node scripts/qa-v64.mjs
      - name: Validate V6.5 regression behavior
        run: node scripts/qa-v65.mjs
      - name: Validate V6.6 regression behavior
        run: node scripts/qa-v66.mjs
      - name: Validate V6.7 regression behavior
        run: node scripts/qa-v67.mjs
      - name: Validate V6.7.1 regression behavior
        run: node scripts/qa-v671.mjs
      - name: Validate live V6.8 behavior
        run: node scripts/qa-v68.mjs
